<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Today’s menus, opening hours and nutrition for Northeastern’s three residential dining halls: Stetson East, International Village and 60 Belvidere." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NU Dining" />
    <meta property="og:title" content="NU Dining" />
    <meta property="og:description" content="Today’s menus, opening hours and nutrition for Northeastern’s three residential dining halls." />
    <meta property="og:url" content="https://nu-dining.vercel.app/" />
    <meta property="og:image" content="https://nu-dining.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NU Dining logo, a bowl with a red flame, beside the words NU Dining." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NU Dining" />
    <meta name="twitter:description" content="Today’s menus, opening hours and nutrition for Northeastern’s three residential dining halls." />
    <meta name="twitter:image" content="https://nu-dining.vercel.app/og-image.png" />
    <meta name="theme-color" content="#0F0F10" />
    <!-- Dark unless the visitor chose light; set before first paint so nothing flashes. -->
    <script>
      (function () {
        var theme = 'dark';
        try { if (localStorage.getItem('nu-dining:theme') === 'light') theme = 'light'; } catch (e) {}
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#F4F4F5' : '#0F0F10');
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>NU Dining</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px; max-width: 32rem">
        NU Dining needs JavaScript to load live menus. You can also check
        <a href="https://dineoncampus.com/northeastern">dineoncampus.com/northeastern</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
