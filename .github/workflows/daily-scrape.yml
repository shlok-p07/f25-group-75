name: Daily Menu Scrape

# DineOnCampus posts the next day's menus around 11 PM–midnight ET.
# GitHub Actions IPs are Cloudflare-blocked from apiv4.dineoncampus.com, so we
# trigger the Vercel /api/scrape endpoint instead — Vercel's IPs are not blocked.

on:
  schedule:
    - cron: '0 5 * * *'   # 1 AM ET  — primary scrape
    - cron: '0 7 * * *'   # 3 AM ET  — backup before breakfast
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-scrape even if data already exists'
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrape via Vercel
        run: |
          echo "Triggering scrape for $(TZ=America/New_York date '+%Y-%m-%d')..."
          FORCE_PARAM=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_PARAM="?force=true"
          fi
          # Strip any scheme or trailing path the secret value might contain
          HOST="${VERCEL_URL#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%%/*}"
          STATUS=$(curl -s -o /tmp/scrape_response.json -w "%{http_code}" --max-time 30 \
            "https://${HOST}/api/scrape${FORCE_PARAM}" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $STATUS"
          cat /tmp/scrape_response.json
          echo ""
          [ "$STATUS" = "200" ] || [ "$STATUS" = "202" ] || { echo "Scrape endpoint returned HTTP $STATUS"; exit 1; }
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
