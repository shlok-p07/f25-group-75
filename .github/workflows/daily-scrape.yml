name: Daily Menu Scrape

# Runs on a self-hosted macOS runner (residential IP required — Cloudflare blocks
# datacenter IPs from apiv4.dineoncampus.com). Falls back to ubuntu-latest if no
# self-hosted runner is available, but the scrape will fail on the Cloudflare step.

on:
  schedule:
    - cron: '0 7 * * *'   # 2 AM EST / 3 AM EDT — after DineOnCampus posts next day's menus
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-scrape even if data already exists'
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend-folder

      - name: Run scraper
        run: |
          echo "Scraping menu for $(TZ=America/New_York date '+%Y-%m-%d')..."
          node run-scrape.js ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        working-directory: backend-folder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
