name: Daily Menu Scrape

# DineOnCampus posts the next day's menus around 11 PM–midnight ET.
# Runs the Puppeteer scraper directly (bypasses Cloudflare via stealth plugin).
# The Vercel cron (vercel.json) also fires at 8 AM UTC as a backup for simple days.

on:
  schedule:
    - cron: '0 5 * * *'   # 1 AM ET  — primary scrape
    - cron: '0 7 * * *'   # 3 AM ET  — backup before breakfast
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend-folder

      - name: Run scraper
        run: |
          echo "Scraping menu for $(TZ=America/New_York date '+%Y-%m-%d')..."
          node run-scrape.js
        working-directory: backend-folder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
