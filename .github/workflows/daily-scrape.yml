name: Daily Menu Scrape

# DineOnCampus posts the next day's menus around 11 PM–midnight ET.
# Trigger the Vercel /api/scrape endpoint directly — Vercel's serverless environment
# handles the DineOnCampus API calls reliably without Puppeteer.
# The Vercel cron (vercel.json) also fires at 8 AM UTC as a backup.

on:
  schedule:
    - cron: '0 5 * * *'   # midnight/1 AM ET — primary scrape
    - cron: '0 7 * * *'   # 2-3 AM ET        — backup before breakfast
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel scrape endpoint
        run: |
          echo "Triggering scrape for $(TZ=America/New_York date '+%Y-%m-%d')..."
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_APP_URL }}/api/scrape" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120)
          cat /tmp/response.json
          echo ""
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Scrape completed successfully (HTTP $HTTP_STATUS)"
          else
            echo "Scrape failed with HTTP $HTTP_STATUS"
            exit 1
          fi
