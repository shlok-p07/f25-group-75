name: Daily Menu Scrape

# DineOnCampus posts the next day's menus around 11 PM–midnight ET.
# We run twice:
#   1. 5:00 AM UTC = midnight/1 AM ET  → primary scrape, catches menus posted overnight
#   2. 7:00 AM UTC = 2-3 AM ET         → backup before breakfast

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: backend-folder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend-folder/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Run menu scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node run-scrape.js
